[package]
name = "logic-core"
version = "0.3.1"
edition = "2021"
description = "Propositional logic proof engine: formulas, natural-deduction rules, verification, and theorem generation"
license = "MIT"
repository = "https://github.com/dogaozden/logic-core"

[lib]
name = "logic_core"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
